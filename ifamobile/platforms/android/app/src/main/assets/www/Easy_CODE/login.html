        <script type="text/javascript" src="cordova.js"></script>
        <script type="text/javascript" src="js/index.js"></script>
        <script type="text/javascript">
            $(document).ready(function () {
                $('#txtuser').focus();
                $('#btnlogin').click(function(event) {
                    window.resolveLocalFileSystemURL(cordova.file.applicationStorageDirectory+'databases/' + 'db4.db', 
                    function(){
                        //==>
                    window.db = window.sqlitePlugin.openDatabase({name: 'db4.db', location: 'default'});
                    db.transaction(function(tx){
                        var querystr='SELECT * from users where username=? and password=?';
                        if(window.location.href.includes('?id=audit')){
                            querystr="SELECT * from users where username=? and password=? and (idprofile='1' or idprofile='3')";
                        }
                        tx.executeSql(querystr, [$('#txtuser').val(), $('#txtpassword').val()], function (tx, res) {
                            if(res.rows.length>0){
                                window.localStorage.iduser=res.rows.item(0).Id;
                                window.localStorage.idprofile=res.rows.item(0).idprofile;
                                if(window.location.href.includes('?id=audit')){
                                    window.location.href="audit.html";
                                }else{
                                    window.location.href="capture.html";
                                }
                            }else{
                                $('#lblstatus').html("Invalid user or password.");
                            }
                        }, function(error){
                            alert(error.message);
                        });
                    }, function(error){
                        alert(error.message);
                    });
                        //==>
                    }, function(){
                        alert('No se encuentra la base de datos');
                        window.location.href="index.html";
                    });
                });
                //===============>
                var trigger = $('.hamburger'),
                  overlay = $('.overlay'),
                 isClosed = false;

                trigger.click(function () {
                  hamburger_cross();      
                });

                function hamburger_cross() {
                  if (isClosed == true) {          
                    overlay.hide();
                    trigger.removeClass('is-open');
                    trigger.addClass('is-closed');
                    isClosed = false;
                  } else {   
                    overlay.show();
                    trigger.removeClass('is-closed');
                    trigger.addClass('is-open');
                    isClosed = true;
                  }
                }
              
                $('[data-toggle="offcanvas"]').click(function () {
                    $('#wrapper').toggleClass('toggled');
                });  
            });
        </script>
