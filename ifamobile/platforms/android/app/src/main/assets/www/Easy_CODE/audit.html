            <!-- Page Content -->
            <div id="page-content-wrapper">
                <button type="button" class="hamburger is-closed" data-toggle="offcanvas">
                    <span class="hamb-top"></span>
                    <span class="hamb-middle"></span>
                    <span class="hamb-bottom"></span>
                </button>
                <div style="position: fixed; top: 0px; left: 100px; margin-top: 5px;">
                    <h3>Audit</h3>
                </div>
                <div class="container">
                    <div class="row form-group">
                        <div class="col-md-12">
                            <h3 id="lblstep">1.- Scan folio:</h3>
                            <input type="text" class="form-control" name="folio" id="folio">                     
                        </div>
                    </div>
                    <div class="row form-group" id="rowreason" style="display: none;">
                        <div class="col-md-6">
                            <select class="form-control border-warning" id="reason">
                                <option value="0">Select a reason</option>
                                <option value="1. Part Number Error">1. Part Number Error</option>
                                <option value="2. Quantity Error">2. Quantity Error</option>
                                <option value="3. Unit Mesure Discrepancy">3. Unit Mesure Discrepancy</option>
                                <option value="4. Wrong Location">4. Wrong Location</option>
                                <option value="5. Others">5. Others</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <input type="button" class="btn btn-info" value="Next" id="btnnext">
                        </div>
                    </div>
                    <div class="row form-group" id="rowopenbox" style="display: none;">
                        <!--<div class="col-xs-6">
                            <input type="checkbox" class="form-check-input" id="chkopenbox">
                            <label class="form-check-label" for="chkopenbox">Open box</label>
                        </div>-->
                        <div class="col-xs-6">
                            <input type="button" class="btn btn-info" value="Save" id="btnsave">
                        </div>
                    </div>
                    <div class="row form-group">
                        <div class="col-md-12">
                            <p style="margin-top: 10px; min-height: 100px;" id="lblstatus"></p>
                        </div>
                    </div>
                    <div class="row form-group" id="buttonsrow" style="display: none;">
                        <div class="col-xs-6 column">
                            <input type="button" class="btn btn-success btn-lg" value="Correct" id="btncorrect">
                        </div>
                        <div class="col-xs-6 column">
                            <input type="button" class="btn btn-danger btn-lg" value="Incorrect" id="btnincorrect">
                        </div>
                    </div>
                    <div class="row form-group">
                        <div class="col-md-12">
                            <input type="button" class="btn btn-info" value="Manual send" id="btnmanualsync">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script type="text/javascript" src="cordova.js"></script>
        <script type="text/javascript" src="js/index.js"></script>
        <script type="text/javascript">
            var cstep=0;
            var cwarehouse='';
            var cmsg='';
            var cfolio='';
            var clocacion='';
            var citemnumber='';
            var cqty=0;
            var copenbox='';
            var creasontoedit='';
            var cresult='';
            $(document).ready(function () {
                if(window.localStorage.idprofile=='3'){
                    $('#btnmanualsync').show();
                }else{
                    $('#btnmanualsync').hide();
                }
                $('#folio').focus();
                $('#folio').keydown(function(e) {
                    if (e.keyCode == 13 || e.keyCode == 9) {
                        switch (cstep) {
                            case 0:
                                checkfolio();
                                break;
                            case 1:
                                checklocation();
                                break;
                            case 2:
                                checkitemnumber();
                                break;
                            case 3:
                                checkqty();
                                break;
                        }
                    }
                });
                $('#btnsave').click(function(event) {
                    checkqty();
                });
                $('#btnnext').click(function(event) {
                    if($('#reason').val()=='0'){
                        window.plugins.toast.showWithOptions({
                            message: 'Select a reason',
                            duration: "long",
                            position: "top",
                            styling: {
                              backgroundColor: '#ff9999'
                            }
                        });
                        return;
                    }
                    creasontoedit=$('#reason').val();

                    $('#lblstep').html("2.- Scan location:");
                    cstep = 1;
                    cmsg += "1.- Correct folio: " + $('#folio').val();
                    $('#lblstatus').html(cmsg);
                    //cfolio = $('#folio').val();
                    $('body').css("background-color","green");
                    //====>
                    if($('#reason').val() == "1. Part Number Error" || $('#reason').val() == "3. Unit Mesure Discrepancy"){
                        $('#lblstep').html("3.- Scan item number:");
                        cstep = 2;
                        cmsg += "<br/>2.- Correct location: " + clocacion
                        $('#lblstatus').html(cmsg);
                    }
                    if($('#reason').val() == "2. Quantity Error"){
                        $('#rowopenbox').show();
                        $('#btnsave').show();

                        navigator.notification.confirm(
                            'Is the box open?',
                             onConfirm,
                            'Easy Inventory',
                            ['Yes','No']
                        );
                        $('#lblstep').html("4.- Type quantity:");
                        cstep = 3;
                        cmsg += "<br/>3.- Correct item number: <br/>" + citemnumber
                        $('#lblstatus').html(cmsg);
                    }

                    $('#rowreason').hide();
                    $('#lblstep').show();
                    $('#folio').show();
                    $('#folio').focus();
                });
                $('#btnmanualsync').click(function(event) {
                    /*window.db = window.sqlitePlugin.openDatabase({name: 'db4.db', location: 'default'});
                    db.transaction(function(tx){
                        tx.executeSql('select * from tags', [], function (tx, res) {
                            for (var i = 0; i < res.rows.length>0; i++) {
                                $('#lblstatus').append(JSON.stringify(res.rows.item(i))+'<br/><br/>');
                            }
                        }, function(error){
                            alert(error.message);
                        });
                    }, function(error){
                        alert(error.message);
                    });*/
                    //=========================>
                    syncdb(false);
                });
                $('#btncorrect').click(function(event) {
                    cresult='Correct';
                    saveCapture();
                });
                $('#btnincorrect').click(function(event) {
                    cresult='Incorrect';
                    $('#rowreason').show();
                    $('#lblstep').hide();
                    $('#folio').hide();
                    $('#buttonsrow').hide();
                    $('body').css("background-color","#bebee2");
                    $('#folio').val('');
                });
                //===============>
                var trigger = $('.hamburger'),
                  overlay = $('.overlay'),
                 isClosed = false;

                trigger.click(function () {
                  hamburger_cross();      
                });

                function hamburger_cross() {
                  if (isClosed == true) {          
                    overlay.hide();
                    trigger.removeClass('is-open');
                    trigger.addClass('is-closed');
                    isClosed = false;
                  } else {   
                    overlay.show();
                    trigger.removeClass('is-closed');
                    trigger.addClass('is-open');
                    isClosed = true;
                  }
                }
              
                $('[data-toggle="offcanvas"]').click(function () {
                    $('#wrapper').toggleClass('toggled');
                });
                //Cada minuto intentar actualizar:
                setInterval(function(){
                    $('#btnmanualsync').click();
                }, 60000);
            });
            function checkfolio(){
                if(!$('#folio').val().startsWith(window.localStorage.tagprefix)){
                    $('#lblstatus').html("It is not a valid folio. " + $('#folio').val());
                    $('body').css("background-color","red");
                    $('#folio').val('');
                    return;
                }
                window.db = window.sqlitePlugin.openDatabase({name: 'db4.db', location: 'default'});
                db.transaction(function(tx){
                    tx.executeSql("select a.*, b.description, b.uom from tags a left join masterdata b on a.itemcode=b.itemcode where tag=? and status='Used'", [$('#folio').val().replace(window.localStorage.tagprefix,'')], function (tx, res) {// and (openbox='Ok' or toaudit=1)
                        if(res.rows.length>0){
                            try {//Evitar cuando vienen en null
                                    cwarehouse = res.rows.item(0).warehouse.toUpperCase();
                                    clocacion = res.rows.item(0).location.toUpperCase();
                                    citemnumber = res.rows.item(0).itemcode.toUpperCase();
                            }catch(err) {}
                            cqty = res.rows.item(0).qty;
                            copenbox = res.rows.item(0).openbox;
                            cfolio = res.rows.item(0).tag;

                            $('#lblstep').html("2.- Select correct or incorrect:");
                            cmsg = "Folio: " + $('#folio').val()+"<br/>";
                            cmsg += "Location: "+res.rows.item(0).location+"<br/>Item number:"+res.rows.item(0).itemcode+'<br/>Description: '+res.rows.item(0).description+'<br/>UOM: '+res.rows.item(0).uom+'<br/>'+"Status: "+res.rows.item(0).status+"<br/>Quantity: " + res.rows.item(0).qty+'<br/>Open box: '+res.rows.item(0).openbox;
                            $('#lblstatus').html(cmsg);
                            $('#buttonsrow').show();
                            $('#folio').hide();
                            $('body').css("background-color","green");
                        }else{
                            $('#lblstatus').html("Folio does not exist or has no status used. " + $('#folio').val());
                            $('body').css("background-color","red");
                        }
                        $('#folio').val('');
                    }, function(error){
                        alert(error.message);
                    });
                }, function(error){
                    alert(error.message);
                });
            }
            function checklocation(){
                /*if(!$('#folio').val().startsWith('L') && !$('#folio').val().startsWith('l')){
                    $('#lblstatus').html("It is not a valid location. " + $('#folio').val());
                    $('body').css("background-color","red");
                    $('#folio').val('');
                    return;
                }*/
                db.transaction(function(tx){
                    tx.executeSql('select * from locations where upper(location)=? and upper(wh)=?', [$('#folio').val().toUpperCase(), cwarehouse.toUpperCase()], function (tx, res) {
                        if(res.rows.length>0){
                            if(res.rows.item(0).wh==cwarehouse){//next step
                                if($('#folio').val().toUpperCase()==clocacion){
                                    $('body').css("background-color","red");
                                    $('#folio').val('');
                                    $('#lblstatus').html("The location must be different");
                                    return;
                                }
                                cmsg += "<br/>2.- Correct location: " + $('#folio').val().toUpperCase();
                                $('#lblstatus').html(cmsg);
                                $('body').css("background-color","green");
                                clocacion = $('#folio').val().toUpperCase();

                                if($('#reason').val() == "4. Wrong Location"){
                                    saveCapture();
                                }else{
                                    $('#lblstep').html("3.- Scan item number:");
                                    cstep = 2;
                                }
                            }else{
                                $('#lblstatus').html("The location does not belong to the warehouse: " + cwarehouse + " - " + $('#folio').val().toUpperCase());
                                $('body').css("background-color","red");
                            }
                        }else{
                            $('#lblstatus').html("Location does not exist. " + $('#folio').val().toUpperCase());
                            $('body').css("background-color","red");
                        }
                        $('#folio').val('');
                    }, function(error){
                        alert(error.message);
                    });
                }, function(error){
                    alert(error.message);
                });
            }
            function checkitemnumber(){
                if(!$('#folio').val().startsWith(window.localStorage.itemprefix) && !$('#folio').val().includes('/')){
                    $('#lblstatus').html("It is not a valid item. " + $('#folio').val());
                    $('body').css("background-color","red");
                    $('#folio').val('');
                    return;
                }
                if($('#folio').val().length>1){
                    if($('#folio').val().startsWith(window.localStorage.itemprefix)){
                        $('#folio').val($('#folio').val().substring(window.localStorage.itemprefix.length));
                    }
                    if($('#folio').val().includes('/')){
                        var temparr=$('#folio').val().split('/');
                        $('#folio').val(temparr[0]);
                    }
                }
                db.transaction(function(tx){
                    tx.executeSql('select * from masterdata where upper(itemcode)=?', [$('#folio').val().toUpperCase()], function (tx, res) {
                        if(res.rows.length>0){
                            //alert($('#folio').val()+'<->'+citemnumber);
                            if($('#folio').val().toUpperCase()==citemnumber){
                                $('body').css("background-color","red");
                                $('#folio').val('');
                                $('#lblstatus').html("Item number must be different");
                                return;
                            }
                            //======>
                            if(res.rows.item(0).uom!='EA'){
                                window.plugins.toast.showWithOptions({
                                    message: "Verifica que la unidad de medida de éste número de parte sea "+res.rows.item(0).uom,
                                    duration: "long",
                                    position: "top",
                                    styling: {
                                      backgroundColor: '#b4b700'
                                    }
                                });
                            }
                            //=======>
                            cmsg += "<br/>3.- Correct item number:<br/>"+$('#folio').val()+'<br/>'+"Description: "+res.rows.item(0).description+"<br/>UOM: " + res.rows.item(0).uom;
                            $('#lblstatus').html(cmsg);
                            $('body').css("background-color","green");
                            citemnumber = $('#folio').val().toUpperCase();

                            if($('#reason').val() == "1. Part Number Error" || $('#reason').val() == "3. Unit Mesure Discrepancy"){
                                saveCapture();
                            }else{
                                $('#rowopenbox').show();

                                navigator.notification.confirm(
                                    'Is the box open?',
                                     onConfirm,
                                    'Easy Inventory',
                                    ['Yes','No']
                                );
                                $('#lblstep').html("4.- Type quantity:");
                                cstep = 3;
                            }
                        }else{
                            $('#lblstatus').html("Item number does not exist. " + $('#folio').val());
                            $('body').css("background-color","red");
                        }
                        $('#folio').val('');
                    }, function(error){
                        alert(error.message);
                    });
                }, function(error){
                    alert(error.message);
                });
            }
            function checkqty(){
                //Si empieza con q, quitarla.
                $('#folio').val($('#folio').val().replace('Q','').replace('q',''));

                if(!isNaN($('#folio').val()) && $('#folio').val().length>0){
                    if($('#folio').val()>0){
                        if($('#folio').val()==cqty){
                            $('body').css("background-color","red");
                            $('#folio').val('');
                            $('#lblstatus').html("Quantity must be different");
                            return;
                        }
                        cmsg += "<br/>4.- Correct quantity: " + $('#folio').val();
                        $('#lblstatus').html(cmsg);
                        $('body').css("background-color","green");
                        cqty = $('#folio').val();
                        //copenbox = $('#chkopenbox').is(':checked') ? 'Ok' : 'No';
                        saveCapture();
                    }else{
                        $('#lblstatus').html("Invalid quantity");
                        $('body').css("background-color","red");
                    }
                }else{
                    $('#lblstatus').html("Invalid quantity");
                    $('body').css("background-color","red");
                }
                $('#folio').val('');
            }
            function saveCapture(){
                window.db.transaction(function (tx) {
                  tx.executeSql("update tags set datetimeaudit=datetime('now', 'localtime'), itemcode=?, status='Used', qty=?, location=?, iduseraudit=?, openbox=?, tosync=1, reasontoedit=?, auditcounter=auditcounter+1, resultaudit=? where tag=?", [citemnumber, cqty, clocacion, window.localStorage.iduser, copenbox, creasontoedit, cresult, cfolio], function(){
                    //Init vars
                    setTimeout(function(){
                        $('#lblstep').html("1.- Scan folio:");
                        $('body').css("background-color","white");
                        $('#rowopenbox').hide();
                        //$('#chkopenbox').prop('checked', false);
                        cstep=0;
                        cwarehouse='';
                        cmsg='';
                        cfolio='';
                        clocacion='';
                        citemnumber='';
                        cqty=0;
                        creasontoedit='';
                        cresult='';
                        $('#lblstatus').html(cmsg);
                        $('#reason').val('0');
                        $('#folio').show();
                        $('#buttonsrow').hide();
                    }, 3000);
                    //=========>
                    syncdb();
                  }, function(error){alert(error.message);});
                }, function(error){
                    alert(error.message);
                });
            }
            function onConfirm(buttonIndex) {
                copenbox = (buttonIndex=='1' ? 'Ok' : 'No');
            }
        </script>
    </body>
