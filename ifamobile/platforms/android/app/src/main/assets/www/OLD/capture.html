            <div id="page-content-wrapper">

                    <div class="row form-group" id="rowopenbox" style="display: none;">

                        </div>-->
                        <div class="col-xs-6">
                            <input type="button" class="btn btn-info" value="Save" id="btnsave">
                        </div>

                        </div>
                    </div>
                    <div class="row form-group">
                        <div class="col-md-12">
                            <input type="button" class="btn btn-info" value="Manual send" id="btnmanualsync">
                            <input type="button" class="btn btn-info" value="Change location" id="btnchangelocation" style="display: none;">

        <script type="text/javascript" src="cordova.js"></script>
        <script type="text/javascript" src="js/index.js"></script>
        <script type="text/javascript">
            var cstep=0;
            var cwarehouse='';
            var cmsg='';
            var cfolio='';
            var clocacion='';
            var citemnumber='';
            var cqty=0;

            var cuom='';
            var clot='';
            var cpackingdate='';
            var copenbox='';
            var correctionmode=false;
            var creasontoedit='';

            var counterbylocation=0;
            $(document).ready(function () {
                /*if(window.localStorage.idprofile=='3'){
                    $('#btnmanualsync').show();
                }else{*/
                    $('#btnmanualsync').hide();
                //}
                $('#folio').focus();
                $('#folio').keydown(function(e) {
                    if (e.keyCode == 13 || e.keyCode == 9) {
                        switch (cstep) {
                            case 0:
                                checklocation();
                                break;
                            case 1:
                                if($('#folio').val()=='APICS2020'){//S@ltill01
                                    correctionmode=true;
                                    $('#lblcm').show();
                                    $('#rowreason').show();
                                    $('#lblstep').hide();
                                    $('#folio').hide();
                                    $('body').css("background-color","#bebee2");
                                    $('#folio').val('');
                                }else{
                                    checkfolio();
                                }
                                break;
                            case 2:
                                checkitemnumber();
                                break;
                            case 3:
                                //checkqty();
                                window.plugins.toast.showWithOptions({
                                    message: 'Wait a minute',
                                    duration: "long",
                                    position: "top",
                                    styling: {
                                      backgroundColor: '#ff9999'
                                    }
                                });
                                break;
                        }
                    }
                });
                $('#btnsave').click(function(event) {
                    checkqty();
                });
                $('#btnnext').click(function(event) {
                    if($('#reason').val()=='0'){
                        window.plugins.toast.showWithOptions({
                            message: 'Select a reason',
                            duration: "long",
                            position: "top",
                            styling: {
                              backgroundColor: '#ff9999'
                            }
                        });
                        return;
                    }
                    creasontoedit = $('#reason').val();
                    $('#lblstatus').html(cmsg);

                    $('#rowreason').hide();
                    $('#lblstep').show();
                    $('#folio').show();
                    $('#folio').focus();
                });
                $('#btnmanualsync').click(function(event) {
                    /*window.db = window.sqlitePlugin.openDatabase({name: 'db4.db', location: 'default'});
                    db.transaction(function(tx){
                        tx.executeSql('select * from tags', [], function (tx, res) {
                            alert(res.rows.length);
                            for (var i = 0; i < res.rows.length>0; i++) {
                                $('#lblstatus').append(JSON.stringify(res.rows.item(i))+'<br/><br/>');
                            }
                        }, function(error){
                            alert(error.message);
                        });
                    }, function(error){
                        alert(error.message);
                    });*/
                    /*window.db = window.sqlitePlugin.openDatabase({name: 'db4.db', location: 'default'});
                    db.transaction(function(tx){
                        tx.executeSql("select * from locations where wh='617'", [], function (tx, res) {
                            for (var i = 0; i < res.rows.length; i++) {
                                $('#lblstatus').append(JSON.stringify(res.rows.item(i))+'<br/><br/>');
                            }
                        }, function(error){
                            alert(error.message);
                        });
                    }, function(error){
                        alert(error.message);
                    });*/
                    //=========================>
                    syncdb(false);
                });

                $('#btnchangelocation').click(function(event) {
                    initlocation();
                });
                //===============>
                var trigger = $('.hamburger'),
                    overlay = $('.overlay'),
                    isClosed = false;

                trigger.click(function () {
                  hamburger_cross();      
                });

                function hamburger_cross() {
                  if (isClosed == true) {          
                    overlay.hide();
                    trigger.removeClass('is-open');
                    trigger.addClass('is-closed');
                    isClosed = false;
                  } else {   
                    overlay.show();
                    trigger.removeClass('is-closed');
                    trigger.addClass('is-open');
                    isClosed = true;
                  }
                }
              
                $('[data-toggle="offcanvas"]').click(function () {
                    $('#wrapper').toggleClass('toggled');
                });
                //Cada minuto intentar actualizar:
                setInterval(function(){
                    $('#btnmanualsync').click();
                }, 60000);
            });
            function checkfolio(){
                if(!$('#folio').val().startsWith(window.localStorage.tagprefix)){
                    $('#lblstatus').html("It is not a valid folio. " + $('#folio').val());
                    $('body').css("background-color","red");
                    $('#folio').val('');
                    return;
                }
                window.db = window.sqlitePlugin.openDatabase({name: 'db4.db', location: 'default'});
                db.transaction(function(tx){
                    //alert($('#folio').val().replace('F','').replace('f',''));
                    tx.executeSql('select a.*, b.description, b.uom from tags a left join masterdata b on a.itemcode=b.itemcode where tag=?', [$('#folio').val().replace(window.localStorage.tagprefix,'')], function (tx, res) {
                        if(res.rows.length>0){
                            if(correctionmode && res.rows.item(0).status!='Used'){
                                cmsg = "This tag has not been captured. " + $('#folio').val();
                                $('#lblstatus').html(cmsg);
                                $('body').css("background-color","yellow");
                                $('#folio').val('');
                                return;
                            }
                            if(cwarehouse != res.rows.item(0).warehouse.toUpperCase()){
                                $('#lblstatus').html("The label rack does not belong to the scanned location: " + cwarehouse + " - " + $('#folio').val() +' - '+res.rows.item(0).warehouse.toUpperCase());
                                $('body').css("background-color","red");
                                return;
                            }
                            if(res.rows.item(0).status=='' || res.rows.item(0).status==null || correctionmode){//next step
                                try {//Evitar cuando vienen en null
                                    cwarehouse = res.rows.item(0).warehouse.toUpperCase();
                                    //clocacion = res.rows.item(0).location.toUpperCase(); se escanea primero la locación
                                    citemnumber = res.rows.item(0).itemcode.toUpperCase();
                                }catch(err) {}
                                cqty = res.rows.item(0).qty;
                                copenbox = res.rows.item(0).openbox;
                                if(!correctionmode){
                                    creasontoedit = res.rows.item(0).reasontoedit;
                                }

                                $('#lblstep').html("3.- Scan item number:");
                                cstep = 2;
                                cmsg = "2.- Correct folio: " + $('#folio').val();
                                $('#lblstatus').html(cmsg);
                                cfolio = $('#folio').val().replace(window.localStorage.tagprefix,'');
                                $('body').css("background-color","green");
                                //====>
                                if(correctionmode && ($('#reason').val() == "1. Part Number Error" || $('#reason').val() == "3. Unit Mesure Discrepancy")){
                                    $('#lblstep').html("3.- Scan item number:");
                                    cstep = 2;
                                    cmsg += "<br/>2.- Correct location: " + clocacion
                                    $('#lblstatus').html(cmsg);
                                }
                                if(correctionmode && $('#reason').val() == "2. Quantity Error"){
                                    $('#rowopenbox').show();
                                    $('#btnsave').show();

                                    /*
                                    navigator.notification.confirm(
                                        'Is the box open?',
                                         onConfirm,
                                        'APICS',
                                        ['Yes','No']
                                    );
                                    */
                                    $('#lblstep').html("4.- Type quantity:");
                                    cstep = 3;
                                    cmsg += "<br/>3.- Correct item number: <br/>" + citemnumber
                                    $('#lblstatus').html(cmsg);
                                }
                            }else{
                                cmsg = "This tag has been captured. " + $('#folio').val();
                                cmsg += "<br/>Location: "+res.rows.item(0).location+"<br/>Item number:"+res.rows.item(0).itemcode+'<br/>Description: '+res.rows.item(0).description+'<br/>UOM: '+res.rows.item(0).uom+'<br/>'+"Status: "+res.rows.item(0).status+"<br/>Quantity: " + res.rows.item(0).qty+'<br/>Open box: '+res.rows.item(0).openbox;
                                $('#lblstatus').html(cmsg);
                                $('body').css("background-color","yellow");
                            }
                        }else{
                            $('#lblstatus').html("Folio does not exist. " + $('#folio').val());
                            $('body').css("background-color","red");
                        }
                        $('#folio').val('');
                    }, function(error){
                        alert(error.message);
                    });
                }, function(error){
                    alert(error.message);
                });
            }
            function checklocation(){
                if(!$('#folio').val().startsWith('B') && !$('#folio').val().startsWith('b')){
                    $('#lblstatus').html("It is not a valid location. It must be starts with B " + $('#folio').val());
                    $('body').css("background-color","red");
                    $('#folio').val('');
                    return;
                }
                var folio=String($('#folio').val().replace('B',''));//.substring(1)

                window.db = window.sqlitePlugin.openDatabase({name: 'db4.db', location: 'default'});
                db.transaction(function(tx){
                    tx.executeSql('select * from locations where upper(plataforma)=?', [folio], function (tx, res) {// and upper(wh)=?    , cwarehouse
                        if(res.rows.length>0){
                            var equalwarehouse=false;
                            var locallocation='';

                            //Aquí puede haber problema si existen locaciones duplicadas, con mismo nombre.
                            //Porque tomamos solo el primero en aparecer en la lista
                            for (var i = 0; i < res.rows.length; i++) {

                                //==>
                                cwarehouse=res.rows.item(i).wh.toUpperCase();
                                locallocation=res.rows.item(i).location;
                                break;
                                /*if(res.rows.item(i).wh.toUpperCase()==cwarehouse){
                                    equalwarehouse=true;
                                    locallocation=res.rows.item(i).location;
                                    break;
                                }*/
                            }

                            //if(equalwarehouse){//next step
                                if(correctionmode && folio.toUpperCase()==clocacion && $('#reason').val() != "5. Others"){
                                    $('body').css("background-color","red");
                                    $('#folio').val('');
                                    $('#lblstatus').html("The location must be different");
                                    return;
                                }
                                cmsg += "<br/>1.- Correct location: " + folio;
                                $('#lblstatus').html(cmsg);
                                $('body').css("background-color","green");
                                clocacion = locallocation;//folio.toUpperCase();

                                counterbylocation=0;
                                $('#lblcounterbylocation').show();
                                $('#btnchangelocation').show();
                                $('#lblcounterbylocation').html(clocacion+' / '+counterbylocation);

                                if(correctionmode && $('#reason').val() == "4. Wrong Location"){
                                    saveCapture();
                                }else{
                                    $('#lblstep').html("2.- Scan folio:");//Scan item number
                                    cstep = 1;
                                }
                            /*}else{
                                $('#lblstatus').html("The location does not belong to the rack(warehouse): " + cwarehouse + " - " + folio+' - '+res.rows.item(0).wh.toUpperCase());
                                $('body').css("background-color","red");
                            }*/
                        }else{
                            $('#lblstatus').html("Location does not exist. " + folio);
                            $('body').css("background-color","red");
                        }
                        $('#folio').val('');
                    }, function(error){
                        alert(error.message);
                    });
                }, function(error){
                    alert(error.message);
                });
            }
            function checkitemnumber(){
                if(!$('#folio').val().startsWith('**{')){
                    $('#lblstatus').html("It is not a valid code. Required structure:<br/> **{itemcode}U--{lot}|*{ddmmyy}|-{weight}"+"<br/>" + $('#folio').val());
                    $('body').css("background-color","red");
                    $('#folio').val('');
                    return;
                }
                if($('#folio').val().length>1){
                    if($('#folio').val().startsWith('**{')){
                        $('#folio').val($('#folio').val().substring('**{'.length));
                    }
                    //====================> Obtener y validar las partes del folio
                    var lvalid=true;
                    var arrtmp=$('#folio').val().split('--');

                    var litem='';
                    var llote='';
                    var lfechaempaque='';
                    var lpeso='';
                    var luom='';
                    if(arrtmp.length!=2){
                        lvalid=false
                    }else{
                        var arrtmp2=arrtmp[1].split('|');
                        if(arrtmp2.length!=3){
                            lvalid=false;
                        }else{
                            litem=arrtmp[0].replace('{','').replace('}','');
                            llote=arrtmp2[0].replace('{','').replace('}','');
                            lfechaempaque=arrtmp2[1].replace('{','').replace('}','');
                            lpeso=arrtmp2[2].replace('{','').replace('}','');
                        }
                    }
                    $('#folio').val('');
                    //Hasta aquí la estructura es correcta, validar los datos individuales
                    if(lvalid){
                        if(!lfechaempaque.startsWith('*')){
                            $('#lblstatus').html("It is not a valid date, it must be start with *: "+lfechaempaque);
                            $('body').css("background-color","red");
                            return;
                        }else{
                            lfechaempaque=lfechaempaque.substring(1);
                        }

                        if(!lpeso.startsWith('-')){
                            $('#lblstatus').html("It is not a valid weight, it must be start with -: "+lpeso);
                            $('body').css("background-color","red");
                            return;
                        }else{
                            lpeso=lpeso.substring(1);
                        }
                        if(isNaN(lpeso)){
                            $('#lblstatus').html("It is not a valid weight: "+lpeso);
                            $('body').css("background-color","red");
                            return;
                        }
                        if(lfechaempaque.length!=6 && lfechaempaque.length!=10){
                            $('#lblstatus').html("It is not a valid date: "+lfechaempaque);
                            $('body').css("background-color","red");
                            return;
                        }
                        if(!litem.endsWith('K') && !litem.endsWith('L') && !litem.endsWith('P')){
                            $('#lblstatus').html("It is not a itemcode, it must be ends with K, L or P: "+litem);
                            $('body').css("background-color","red");
                            return;
                        }
                        luom=litem.substring(litem.length - 1);
                        litem=litem.substring(0, litem.length - 1);
                        //Validar Item==================================>
                        db.transaction(function(tx){
                            tx.executeSql('select * from masterdata where upper(itemcode)=?', [litem.toUpperCase()], function (tx, res) {
                                if(res.rows.length>0){
                                    if(correctionmode && litem.toUpperCase()==citemnumber && $('#reason').val() != "5. Others"){
                                        $('body').css("background-color","red");
                                        $('#folio').val('');
                                        $('#lblstatus').html("Item number must be different");
                                        return;
                                    }
                                    //======>
                                    /*if(res.rows.item(0).uom!='EA'){
                                        window.plugins.toast.showWithOptions({
                                            message: "Verifica que la unidad de medida de éste número de parte sea "+res.rows.item(0).uom,
                                            duration: "long",
                                            position: "top",
                                            styling: {
                                              backgroundColor: '#b4b700'
                                            }
                                        });
                                    }*/
                                    //=======>
                                    cmsg += "<br/>2.- Correct item number:<br/>"+litem.toUpperCase()+'<br/>'+"Description: "+res.rows.item(0).description+"<br/>UOM: " + res.rows.item(0).uom;
                                    $('#lblstatus').html(cmsg);
                                    $('body').css("background-color","green");
                                    citemnumber = litem.toUpperCase();
                                    cqty=lpeso;
                                    clot=llote;
                                    cpackingdate=lfechaempaque;
                                    cuom=luom;

                                    cstep = 3;

                                    counterbylocation++;
                                    $('#lblcounterbylocation').html(clocacion+' / '+counterbylocation);

                                    
                                    /*if(correctionmode && ($('#reason').val() == "1. Part Number Error" || $('#reason').val() == "3. Unit Mesure Discrepancy")){*/
                                        saveCapture();
                                    /*}else{
                                        $('#rowopenbox').show();
                                        navigator.notification.confirm(
                                            'Is the box open?',
                                             onConfirm,
                                            'APICS',
                                            ['Yes','No']
                                        );
                                        $('#lblstep').html("4.- Type quantity:");
                                        cstep = 3;
                                    }*/
                                    
                                }else{
                                    $('#lblstatus').html("Item number does not exist. " + litem);
                                    $('body').css("background-color","red");
                                }
                                $('#folio').val('');
                            }, function(error){
                                alert(error.message);
                            });
                        }, function(error){
                            alert(error.message);
                        });
                        //============================>Fin de validar item
                    }else{
                        $('#lblstatus').html("It is not a valid code. Required structure:<br/> **{itemcode}U--{lot}|*{ddmmyy}|-{weight}"+"<br/>" + $('#folio').val());
                        $('body').css("background-color","red");
                    }
                    //==================================================>
                }
                $('#folio').val('');
            }
            function checkqty(){
                //Si empieza con q, quitarla.
                $('#folio').val($('#folio').val().replace('Q','').replace('q',''));

                if(!isNaN($('#folio').val()) && $('#folio').val().length>0){
                    if($('#folio').val()>0){
                        if(correctionmode && $('#folio').val()==cqty && $('#reason').val() != "5. Others"){
                            $('body').css("background-color","red");
                            $('#folio').val('');
                            $('#lblstatus').html("Quantity must be different");
                            return;
                        }
                        cmsg += "<br/>4.- Correct quantity: " + $('#folio').val();
                        $('#lblstatus').html(cmsg);
                        $('body').css("background-color","green");
                        cqty = $('#folio').val();
                        //copenbox = $('#chkopenbox').is(':checked') ? 'Ok' : 'No';
                        saveCapture();
                    }else{
                        $('#lblstatus').html("Invalid quantity");
                        $('body').css("background-color","red");
                    }
                }else{
                    $('#lblstatus').html("Invalid quantity");
                    $('body').css("background-color","red");
                }
                $('#folio').val('');
            }
            function saveCapture(){
                try {
                    if(cqty>999){
                        alert('La cantidad es mayor a 999 si no es correcto, reportarlo: '+cqty);
                    }
                }catch(err) {
                    alert('Ha ocurrido un problema, reportarlo. '+cqty);
                }
                
                window.db.transaction(function (tx) {
                  tx.executeSql("update tags set datetimecaptured=datetime('now', 'localtime'), itemcode=?, status='Used', qty=?, location=?, iduser=?, openbox=?, tosync=1, reasontoedit=?, lot=?, packingdate=?, uom=? where tag=?", [citemnumber, cqty, clocacion, window.localStorage.iduser, copenbox, creasontoedit, clot, cpackingdate, cuom, cfolio], function(){
                    //Init vars
                    setTimeout(function(){
                        $('#lblstep').html("2.- Scan folio:");
                        $('body').css("background-color","white");
                        $('#lblcm').hide();
                        $('#rowopenbox').hide();
                        //$('#chkopenbox').prop('checked', false);
                        cstep=1;
                        //cwarehouse='';
                        cmsg='';
                        cfolio='';
                        //clocacion='';
                        citemnumber='';
                        cqty=0;
                        correctionmode=false;
                        creasontoedit='';
                        copenbox='';

                        clot='';
                        cpackingdate='';
                        cuom='';
                        $('#lblstatus').html(cmsg);
                        $('#reason').val('0');
                    }, 1000);
                    //=========>
                    syncdb();
                  }, function(error){alert(error.message);});
                }, function(error){
                    alert(error.message);
                });
            }
            function onConfirm(buttonIndex) {
                copenbox = (buttonIndex=='1' ? 'Ok' : 'No');
            }
            function initlocation(){
                $('#lblstep').html("1.- Scan location:");
                $('body').css("background-color","white");
                $('#lblcm').hide();
                $('#rowopenbox').hide();
                $('#lblcounterbylocation').html('').hide();
                //$('#chkopenbox').prop('checked', false);
                cstep=0;
                cwarehouse='';
                cmsg='';
                cfolio='';
                clocacion='';
                citemnumber='';
                cqty=0;
                correctionmode=false;
                creasontoedit='';
                copenbox='';

                clot='';
                cpackingdate='';
                cuom='';
                $('#lblstatus').html(cmsg);
                $('#reason').val('0');
            }
        </script>
    </body>
