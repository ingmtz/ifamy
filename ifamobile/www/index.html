        <script type="text/javascript">
            $(document).ready(function () {
                $('#btndownload').click(function(event) {

                    function(){

                        });
                        //=>
                    }, function(err){
                        alert('Error:'+JSON.stringify(err));
                    });

                    
                    window.localStorage.apiurl=$('#serverurl').val();
                    $('#btndownload').prop('disabled', true).val('Wait...');
                    syncdb(true);
                    
                });
                //===============>
                var trigger = $('.hamburger'),
                  overlay = $('.overlay'),
                 isClosed = false;

                trigger.click(function () {
                  hamburger_cross();      
                });

                function hamburger_cross() {
                  if (isClosed == true) {          
                    overlay.hide();
                    trigger.removeClass('is-open');
                    trigger.addClass('is-closed');
                    isClosed = false;
                  } else {   
                    overlay.show();
                    trigger.removeClass('is-closed');
                    trigger.addClass('is-open');
                    isClosed = true;
                  }
                }
              
                $('[data-toggle="offcanvas"]').click(function () {
                    $('#wrapper').toggleClass('toggled');
                });  
            });
            function listDir(path){
              window.resolveLocalFileSystemURL(path,
                function (fileSystem) {
                  var reader = fileSystem.createReader();
                  reader.readEntries(
                    function (entries) {
                        alert(JSON.stringify(entries));
                      console.log(entries);
                    },
                    function (err) {
                        alert(err);
                      console.log(err);
                    }
                  );
                }, function (err) {
                  console.log(err);
                }
              );
            }
            function testdownloadeddb(){
                window.db = window.sqlitePlugin.openDatabase({name: 'db4.db', location: 'default'});
                db.transaction(function(tx){
                    tx.executeSql('select count(*) as total from tags;', [], function (tx, res) {
                        if(res.rows.length>0){
                            alert('Total tags:'+res.rows.item(0).total);
                        }else{
                            alert('No data');
                        }
                        $('#folio').val('');
                    }, function(error){
                        alert(error.message);
                    });
                }, function(error){
                    alert(error.message);
                });
            }
            function start(){
                window.resolveLocalFileSystemURL(cordova.file.applicationStorageDirectory+'databases/' + 'db4.db', 
                    function(){
                        //=>
                        window.db = window.sqlitePlugin.openDatabase({name: 'db4.db', location: 'default'});
                        db.transaction(function(tx){
                            //Check if row exists
                            tx.executeSql('SELECT * from config', [], function (tx, res) {
                                if(res.rows.length>0){
                                    window.localStorage.apiurl=res.rows.item(0).apiurl;
                                    window.localStorage.tagprefix=res.rows.item(0).tagprefix;
                                    window.localStorage.itemprefix=res.rows.item(0).itemprefix;
                                    if(res.rows.item(0).apiurl!=''){
                                        $('#serverurl').val(res.rows.item(0).apiurl);
                                    }

                                    $('#lblstatus').html('Last sync: '+res.rows.item(0).lastupdate+'<br/>');
                                    if(!window.location.href.includes('?id=1')){
                                        window.location.href="login.html";
                                    }
                                }else{
                                    tx.executeSql('insert into config values(?, ?, ?)', [device.uuid, "Never", $('#serverurl').val()], function(){}, function(error){alert(error.message);});
                                    $('#lblstatus').html('Last sync: Never<br/>');
                                }
                            }, function(error){
                                //alert('You need to download database.');
                                alert(error.message);
                            });
                        }, function(error){
                            //alert('You need to download database');
                            alert(error.message);
                        });
                        //=>
                    }, function(){
                        //$('#btndownload').click();
                    });
            }
